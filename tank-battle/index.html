<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg1: #0e1116;
    --bg2: #141a22;
    --panel: #1c232e;
    --border: #2e3a49;
    --text: #dbe4ef;
    --dim: #8b98a9;
    --gold: #ffd24a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #1a2230, var(--bg1) 60%);
    color: var(--text);
    font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    -webkit-user-select: none; user-select: none;
  }
  header {
    padding: 18px 12px 6px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255, 210, 74, .35);
  }
  header p { margin: 6px 0 0; color: var(--dim); font-size: 12px; letter-spacing: 1px; }

  #hud {
    display: flex; align-items: center; gap: 18px;
    padding: 10px 16px; margin: 10px 0;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; min-width: 416px; max-width: 96vw;
    flex-wrap: wrap; justify-content: center;
  }
  .hud-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .hud-item .label { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .hud-item .value { font-weight: bold; font-size: 16px; color: #fff; min-width: 26px; text-align: center; }
  .icon { width: 12px; height: 12px; display: inline-block; border-radius: 3px; }
  .life-icon { background: var(--gold); }
  .enemy-icon { background: #c0c0c8; }
  .enemy-icon.fast { background: #7fd4ff; }
  .enemy-icon.power { background: #7cff8a; }
  .enemy-icon.armor { background: #ff8a7c; }

  #stage {
    position: relative;
    width: 416px; max-width: 96vw;
    background: #000;
    border: 3px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }

  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center;
    background: rgba(8, 11, 16, .82);
    backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; color: var(--gold); font-size: 30px; letter-spacing: 3px; }
  #overlay .sub { color: var(--text); font-size: 14px; max-width: 320px; line-height: 1.7; }
  #overlay .sub b { color: #fff; }
  #overlay button {
    cursor: pointer; font-family: inherit; font-size: 15px; letter-spacing: 2px;
    padding: 11px 26px; color: #171205; background: var(--gold);
    border: none; border-radius: 8px; font-weight: bold;
    box-shadow: 0 4px 0 #a8861f;
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a8861f; }

  footer { padding: 14px; color: var(--dim); font-size: 12px; text-align: center; line-height: 1.8; }
  footer kbd {
    background: var(--panel); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; color: var(--text);
  }

  #touch {
    display: none; gap: 10px; margin: 12px 0;
  }
  @media (hover: none), (pointer: coarse) {
    #touch { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); }
    footer { display: none; }
  }
  #touch button {
    font-size: 20px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px;
  }
  #touch button:active { background: var(--gold); color: #171205; }
</style>
</head>
<body>
  <header>
    <h1>坦克大战</h1>
    <p>BATTLE CITY · HTML5</p>
  </header>

  <div id="hud">
    <div class="hud-item"><span class="label">分数</span><span class="value" id="score">0</span></div>
    <div class="hud-item"><span class="label">关卡</span><span class="value" id="level">1</span></div>
    <div class="hud-item" id="livesBox"><span class="label">生命</span><span id="lives"></span></div>
    <div class="hud-item"><span class="label">敌人</span><span id="enemies"></span></div>
    <button id="muteBtn" style="cursor:pointer;margin-left:auto;font-family:inherit;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;">🔊</button>
  </div>

  <div id="stage">
    <canvas id="game" width="416" height="416"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">坦克大战</h2>
      <div class="sub" id="ovSub">
        <b>WASD / 方向键</b> 移动<br>
        <b>空格</b> 开火 · <b>P</b> 暂停<br>
        守住你的基地（金鹰），消灭所有敌人！
      </div>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>

  <div id="touch">
    <button data-k="up"    style="grid-column:2">▲</button>
    <button data-k="left"  style="grid-column:1;grid-row:2">◀</button>
    <button data-k="fire"  style="grid-column:2;grid-row:2">●</button>
    <button data-k="right" style="grid-column:3;grid-row:2">▶</button>
    <button data-k="down"  style="grid-column:2;grid-row:3">▼</button>
  </div>

  <footer>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或 <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 移动
    &nbsp;·&nbsp; <kbd>空格</kbd> 开火 &nbsp;·&nbsp; <kbd>P</kbd> 暂停 &nbsp;·&nbsp; <kbd>M</kbd> 静音
  </footer>

<script>
(() => {
'use strict';

/* ============ 常量 ============ */
const TILE = 32;
const COLS = 13;
const ROWS = 13;
const W = COLS * TILE;   // 416
const H = ROWS * TILE;   // 416
const TANK = 26;         // 坦克边长
const BULLET = 5;        // 子弹边长

const T = { EMPTY:0, BRICK:1, STEEL:2, WATER:3, GRASS:4, EAGLE:5 };
const DIR = { UP:0, RIGHT:1, DOWN:2, LEFT:3 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

const ENEMY_TYPES = {
  basic: { speed: 1.0, hp: 1, points: 100, color: '#c0c0c8' },
  fast:  { speed: 1.6, hp: 1, points: 200, color: '#7fd4ff' },
  power: { speed: 1.2, hp: 1, points: 300, color: '#7cff8a' },
  armor: { speed: 0.9, hp: 3, points: 400, color: '#ff8a7c' },
};

/* 关卡地图：13x13，#砖 S钢 W水 G草 E基地 */
const LEVELS = [
  [
    ".............",
    ".#.#.#.#.#.#.",
    ".#.#.#.#.#.#.",
    ".#.#.....#.#.",
    ".#.#.SSS.#.#.",
    ".....S.S.....",
    ".#.#.S.S.#.#.",
    ".#.#.....#.#.",
    ".#.#.#.#.#.#.",
    ".#.#.#.#.#.#.",
    ".............",
    ".....###.....",
    ".....#E#.....",
  ],
  [
    "........S....",
    ".#.#.#.#S#.#.",
    ".#.#.#.#S#.#.",
    ".#.#..SS..#.#",
    ".G.#..SS.#.G.",
    "....#....#...",
    ".#.#.....#.#.",
    ".#.#.WWW.#.#.",
    ".#.#.WWW.#.#.",
    ".#.#.....#.#.",
    ".............",
    "....#####....",
    "....#.E.#....",
  ],
  [
    ".............",
    ".....#.#.....",
    ".#.#.#.#.#.#.",
    ".#.SS.#.SS.#.",
    ".#....#....#.",
    "..#.#.#.#.#..",
    "....#...#....",
    "..#.#.#.#.#..",
    ".#....#....#.",
    ".#.SS.#.SS.#.",
    ".#.#.....#.#.",
    "....#####....",
    "....#.E.#....",
  ],
];

const SPAWN_POINTS = [
  { c: 0,  r: 0 },
  { c: 6,  r: 0 },
  { c: 12, r: 0 },
];
const PLAYER_SPAWN = { c: 4, r: 12 };
const EAGLE_POS = { c: 6, r: 12 };

/* ============ DOM ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.max(1, window.devicePixelRatio || 1);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const livesEl = document.getElementById('lives');
const enemiesEl = document.getElementById('enemies');
const muteBtn = document.getElementById('muteBtn');

/* ============ 音效 ============ */
let audioCtx = null;
let muted = false;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
const sfx = {
  shoot:  () => tone(880, 0.08, 'square', 0.04, -500),
  brick:  () => tone(160, 0.12, 'sawtooth', 0.05, -60),
  steel:  () => tone(2200, 0.05, 'square', 0.03),
  boom:   () => tone(120, 0.35, 'sawtooth', 0.07, -90),
  dead:   () => tone(400, 0.6, 'square', 0.06, -340),
  start:  () => tone(523, 0.12, 'square', 0.05),
};

/* ============ 游戏状态 ============ */
let grid;               // 二维数组
let player;             // 玩家坦克对象
let enemies = [];       // 敌方坦克数组
let bullets = [];       // 子弹数组
let effects = [];       // 爆炸特效
let enemyQueue = [];    // 待生成敌人类型
let spawnCooldown = 0;
let score = 0;
let lives = 3;
let level = 1;
let gameState = 'menu';  // menu | playing | paused | gameover | win
let frame = 0;
let respawnTimer = 0;

const keys = Object.create(null);

/* ============ 工具 ============ */
function makeTank(x, y, dir, opts) {
  return {
    x, y, dir, size: TANK,
    speed: opts.speed,
    hp: opts.hp,
    maxHp: opts.hp,
    color: opts.color,
    isPlayer: !!opts.isPlayer,
    type: opts.type || 'basic',
    points: opts.points || 0,
    shootCooldown: 0,
    spawnTimer: opts.spawnTimer || 0,
    moveTimer: 0,
  };
}

function tileCenterX(c) { return c * TILE + TILE / 2; }
function tileCenterY(r) { return r * TILE + TILE / 2; }
function spawnAt(c, r) {
  return {
    x: tileCenterX(c) - TANK / 2,
    y: tileCenterY(r) - TANK / 2,
  };
}

function resetGrid(levelIdx) {
  const map = LEVELS[(levelIdx - 1) % LEVELS.length];
  grid = map.map(row => {
    return row.split('').map(ch => {
      switch (ch) {
        case '#': return T.BRICK;
        case 'S': return T.STEEL;
        case 'W': return T.WATER;
        case 'G': return T.GRASS;
        case 'E': return T.EAGLE;
        default:  return T.EMPTY;
      }
    });
  });
}

function blocksTank(tile) {
  return tile === T.BRICK || tile === T.STEEL || tile === T.WATER || tile === T.EAGLE;
}

function rectHitsSolid(x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 1) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 1) / TILE);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
      if (blocksTank(grid[r][c])) return true;
    }
  }
  return false;
}

function tankCollides(x, y, self) {
  const list = self && self.isPlayer ? enemies : [player, ...enemies];
  for (const t of list) {
    if (!t || t === self || t.dead) continue;
    if (x < t.x + t.size && x + TANK > t.x && y < t.y + t.size && y + TANK > t.y) return true;
  }
  return false;
}

function moveTank(t, dir) {
  const nx = t.x + DX[dir] * t.speed;
  const ny = t.y + DY[dir] * t.speed;
  if (nx < 0 || ny < 0 || nx + TANK > W || ny + TANK > H) return false;
  if (rectHitsSolid(nx, ny, TANK, TANK)) return false;
  if (tankCollides(nx, ny, t)) return false;
  t.x = nx; t.y = ny;
  return true;
}

function snapForDir(t, dir) {
  if (dir === DIR.UP || dir === DIR.DOWN) {
    t.x = Math.round((t.x + TANK / 2 - TILE / 2) / TILE) * TILE + (TILE - TANK) / 2;
  } else {
    t.y = Math.round((t.y + TANK / 2 - TILE / 2) / TILE) * TILE + (TILE - TANK) / 2;
  }
}

function isBlockedAhead(t) {
  const nx = t.x + DX[t.dir] * t.speed;
  const ny = t.y + DY[t.dir] * t.speed;
  return nx < 0 || ny < 0 || nx + TANK > W || ny + TANK > H
      || rectHitsSolid(nx, ny, TANK, TANK) || tankCollides(nx, ny, t);
}

function shootBullet(t, owner) {
  if (t.shootCooldown > 0 || t.spawnTimer > 0) return;
  const size = BULLET;
  const cx = t.x + TANK / 2;
  const cy = t.y + TANK / 2;
  let bx, by;
  const reach = TANK / 2 + 2;
  if (t.dir === DIR.UP)    { bx = cx - size / 2; by = cy - reach - size; }
  else if (t.dir === DIR.DOWN) { bx = cx - size / 2; by = cy + reach; }
  else if (t.dir === DIR.LEFT) { bx = cx - reach - size; by = cy - size / 2; }
  else { bx = cx + reach; by = cy - size / 2; }
  bullets.push({ x: bx, y: by, dir: t.dir, size, speed: owner === 'player' ? 5 : 4, owner, dead: false });
  t.shootCooldown = t.isPlayer ? 20 : 80;
  sfx.shoot();
}

/* ============ 生成 / 击杀 ============ */
function buildEnemyQueue(lv) {
  const q = [];
  const total = Math.min(6 + lv * 2, 16);
  for (let i = 0; i < total; i++) {
    const r = Math.random();
    let type = 'basic';
    if (lv >= 2 && r < 0.28) type = 'fast';
    if (lv >= 3 && r < 0.45) type = (r < 0.2 ? 'power' : 'fast');
    if (lv >= 4 && r > 0.82) type = 'armor';
    q.push(type);
  }
  return q;
}

function trySpawnEnemy() {
  if (enemyQueue.length === 0) return;
  const alive = enemies.filter(e => !e.dead);
  if (alive.length >= 2) return;
  // 找一个空闲出生点
  for (const sp of SPAWN_POINTS) {
    const pos = spawnAt(sp.c, sp.r);
    if (tankCollides(pos.x, pos.y, null)) continue;
    const type = enemyQueue.shift();
    const spec = ENEMY_TYPES[type];
    const e = makeTank(pos.x, pos.y, DIR.DOWN, {
      speed: spec.speed, hp: spec.hp, color: spec.color,
      isPlayer: false, type, points: spec.points, spawnTimer: 45,
    });
    enemies.push(e);
    return;
  }
}

function spawnPlayer() {
  const pos = spawnAt(PLAYER_SPAWN.c, PLAYER_SPAWN.r);
  player = makeTank(pos.x, pos.y, DIR.UP, {
    speed: 2.4, hp: 1, color: '#ffd24a',
    isPlayer: true, points: 0, spawnTimer: 50,
  });
}

function damageTank(t, dmg = 1) {
  t.hp -= dmg;
  if (t.hp <= 0) {
    t.dead = true;
    addExplosion(t.x + TANK / 2, t.y + TANK / 2, t.isPlayer ? '#ffd24a' : t.color);
    if (t.isPlayer) {
      sfx.dead();
      onPlayerDeath();
    } else {
      sfx.boom();
      score += t.points;
    }
  } else {
    addExplosion(t.x + TANK / 2, t.y + TANK / 2, '#ffffff', 0.4);
    sfx.steel();
  }
}

function onPlayerDeath() {
  lives--;
  if (lives <= 0) {
    gameOver(false);
    return;
  }
  player = null;
  respawnTimer = 60;
}

function destroyBase() {
  const c = EAGLE_POS.c, r = EAGLE_POS.r;
  if (grid[r][c] === T.EAGLE) {
    grid[r][c] = T.EMPTY;
    sfx.boom();
    addExplosion(tileCenterX(c), tileCenterY(r), '#ffd24a', 1.2);
  }
  gameOver(false);
}

function addExplosion(x, y, color, scale = 1) {
  effects.push({ x, y, color, life: 24, maxLife: 24, scale });
}

/* ============ 关卡流程 ============ */
function startGame() {
  score = 0; lives = 3; level = 1;
  loadLevel(level);
  setState('playing');
  sfx.start();
}

function loadLevel(lv) {
  resetGrid(lv);
  enemies = [];
  bullets = [];
  effects = [];
  enemyQueue = buildEnemyQueue(lv);
  spawnCooldown = 30;
  spawnPlayer();
}

function nextLevel() {
  level++;
  loadLevel(level);
  setState('playing');
  sfx.start();
}

function setState(s) {
  gameState = s;
  if (s === 'playing') { overlay.classList.add('hidden'); return; }
  overlay.classList.remove('hidden');
  startBtn.style.display = 'block';
  if (s === 'menu') {
    ovTitle.textContent = '坦克大战';
    ovSub.innerHTML = '<b>WASD / 方向键</b> 移动<br><b>空格</b> 开火 · <b>P</b> 暂停<br>守住你的基地（金鹰），消灭所有敌人！';
    startBtn.textContent = '开始游戏';
  } else if (s === 'paused') {
    ovTitle.textContent = '已暂停';
    ovSub.innerHTML = '按 <b>P</b> 或点击按钮继续';
    startBtn.textContent = '继续游戏';
  } else if (s === 'gameover') {
    ovTitle.textContent = '游戏结束';
    ovSub.innerHTML = '你的基地被摧毁了！<br>最终分数：<b>' + score + '</b> · 关卡 ' + level;
    startBtn.textContent = '重新开始';
  } else if (s === 'win') {
    ovTitle.textContent = '通关胜利！';
    ovSub.innerHTML = '恭喜！你守住了基地！<br>最终分数：<b>' + score + '</b> · 关卡 ' + level;
    startBtn.textContent = '再玩一次';
  }
}

function gameOver(won) {
  setState(won ? 'win' : 'gameover');
}

/* ============ 输入 ============ */
const KEY_DIR = {
  ArrowUp: DIR.UP, KeyW: DIR.UP,
  ArrowRight: DIR.RIGHT, KeyD: DIR.RIGHT,
  ArrowDown: DIR.DOWN, KeyS: DIR.DOWN,
  ArrowLeft: DIR.LEFT, KeyA: DIR.LEFT,
};

document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'KeyP') { togglePause(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'Enter' || e.code === 'Space') {
    if (gameState === 'paused') { setState('playing'); return; }
    if (gameState === 'menu' || gameState === 'gameover' || gameState === 'win') { startGame(); return; }
  }
  if (e.code === 'Space') { keys.fire = true; return; }
  const d = KEY_DIR[e.code];
  if (d !== undefined) keys[d] = true;
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') { keys.fire = false; return; }
  const d = KEY_DIR[e.code];
  if (d !== undefined) keys[d] = false;
});

function togglePause() {
  if (gameState === 'playing') setState('paused');
  else if (gameState === 'paused') setState('playing');
}
function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
}
muteBtn.addEventListener('click', () => { ensureAudio(); toggleMute(); });
startBtn.addEventListener('click', () => {
  ensureAudio();
  if (gameState === 'paused') { setState('playing'); return; }
  startGame();
});

/* 触屏按键 */
document.querySelectorAll('#touch button').forEach(btn => {
  const k = btn.dataset.k;
  const press = () => {
    ensureAudio();
    if (k === 'fire') { keys.fire = true; return; }
    const d = { up: DIR.UP, down: DIR.DOWN, left: DIR.LEFT, right: DIR.RIGHT }[k];
    if (d !== undefined) keys[d] = true;
  };
  const release = () => {
    if (k === 'fire') { keys.fire = false; return; }
    const d = { up: DIR.UP, down: DIR.DOWN, left: DIR.LEFT, right: DIR.RIGHT }[k];
    if (d !== undefined) keys[d] = false;
  };
  btn.addEventListener('touchstart', e => { e.preventDefault(); press(); });
  btn.addEventListener('touchend', e => { e.preventDefault(); release(); });
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

/* ============ 更新逻辑 ============ */
function updatePlayer() {
  if (!player || player.dead) return;
  if (player.spawnTimer > 0) { player.spawnTimer--; return; }

  let wantDir = player.dir;
  for (const d of [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT]) {
    if (keys[d]) { wantDir = d; break; }
  }
  const moving = keys[DIR.UP] || keys[DIR.DOWN] || keys[DIR.LEFT] || keys[DIR.RIGHT];
  if (wantDir !== player.dir) {
    player.dir = wantDir;
    snapForDir(player, wantDir);
  }
  if (moving) moveTank(player, player.dir);
  if (player.shootCooldown > 0) player.shootCooldown--;
  if (keys.fire) shootBullet(player, 'player');
}

function updateEnemies() {
  if (spawnCooldown > 0) spawnCooldown--;
  else { trySpawnEnemy(); spawnCooldown = 70; }

  for (const e of enemies) {
    if (e.dead) continue;
    if (e.spawnTimer > 0) { e.spawnTimer--; continue; }

    e.moveTimer--;
    if (e.moveTimer <= 0 || isBlockedAhead(e)) {
      const old = e.dir;
      // 有概率朝玩家方向
      if (player && !player.dead && Math.random() < 0.15) {
        const dx = player.x - e.x, dy = player.y - e.y;
        if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
        else e.dir = dy > 0 ? DIR.DOWN : DIR.UP;
      } else {
        do { e.dir = Math.floor(Math.random() * 4); } while (e.dir === (old + 2) % 4 && Math.random() < 0.7);
      }
      snapForDir(e, e.dir);
      e.moveTimer = 40 + Math.floor(Math.random() * 120);
    }
    moveTank(e, e.dir);

    e.shootCooldown--;
    if (e.shootCooldown <= 0) {
      shootBullet(e, 'enemy');
      e.shootCooldown = 110 + Math.floor(Math.random() * 160);
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateBullets() {
  for (const b of bullets) {
    if (b.dead) continue;
    const steps = Math.ceil(b.speed);
    for (let i = 0; i < steps && !b.dead; i++) {
      b.x += DX[b.dir];
      b.y += DY[b.dir];

      if (b.x < 0 || b.y < 0 || b.x + b.size > W || b.y + b.size > H) { b.dead = true; break; }

      // 撞墙
      const c0 = Math.floor(b.x / TILE), c1 = Math.floor((b.x + b.size - 1) / TILE);
      const r0 = Math.floor(b.y / TILE), r1 = Math.floor((b.y + b.size - 1) / TILE);
      let wallHit = false;
      for (let r = r0; r <= r1 && !wallHit; r++) {
        for (let c = c0; c <= c1 && !wallHit; c++) {
          const tile = grid[r][c];
          if (tile === T.BRICK) { grid[r][c] = T.EMPTY; addExplosion(c*TILE+TILE/2, r*TILE+TILE/2, '#b5722f', 0.6); sfx.brick(); b.dead = true; wallHit = true; }
          else if (tile === T.STEEL) { addExplosion(c*TILE+TILE/2, r*TILE+TILE/2, '#9aa7b8', 0.4); sfx.steel(); b.dead = true; wallHit = true; }
          else if (tile === T.EAGLE) { destroyBase(); b.dead = true; wallHit = true; }
        }
      }
      if (b.dead) break;

      // 撞坦克
      if (b.owner === 'player') {
        for (const e of enemies) {
          if (e.dead || e.spawnTimer > 0) continue;
          if (b.x < e.x + e.size && b.x + b.size > e.x && b.y < e.y + e.size && b.y + b.size > e.y) {
            damageTank(e); b.dead = true; break;
          }
        }
      } else {
        if (player && !player.dead && player.spawnTimer <= 0 &&
            b.x < player.x + player.size && b.x + player.size > player.x &&
            b.y < player.y + player.size && b.y + player.size > player.y) {
          damageTank(player); b.dead = true;
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
}

function updateEffects() {
  for (const f of effects) f.life--;
  effects = effects.filter(f => f.life > 0);
}

function checkLevelClear() {
  if (enemyQueue.length === 0 && enemies.length === 0 && gameState === 'playing') {
    nextLevel();
  }
}

function update() {
  updatePlayer();
  updateEnemies();
  updateBullets();
  updateEffects();
  if (!player && respawnTimer > 0 && gameState === 'playing') {
    respawnTimer--;
    if (respawnTimer <= 0) spawnPlayer();
  }
  checkLevelClear();
  updateHUD();
}

/* ============ 绘制 ============ */
function drawTile(c, r) {
  const tile = grid[r][c];
  const x = c * TILE, y = r * TILE;
  if (tile === T.EMPTY) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(x, y, TILE, TILE);
    return;
  }
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(x, y, TILE, TILE);
  if (tile === T.BRICK) {
    ctx.fillStyle = '#a14a22';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#c96a30';
    ctx.fillRect(x + 1, y + 1, TILE - 2, 14);
    ctx.fillRect(x + 1, y + 17, TILE - 2, 14);
    ctx.fillStyle = '#7a3518';
    ctx.fillRect(x + 15, y + 1, 1, 14); ctx.fillRect(x + 15, y + 17, 1, 14);
  } else if (tile === T.STEEL) {
    ctx.fillStyle = '#c8d2dc';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#eef3f7';
    ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
    ctx.fillStyle = '#8a97a5';
    ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
  } else if (tile === T.WATER) {
    ctx.fillStyle = '#1c4b8f';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#2f6fc4';
    ctx.fillRect(x + 2, y + 4, 12, 6);
    ctx.fillRect(x + 18, y + 20, 12, 6);
    ctx.fillStyle = '#57a0e8';
    ctx.fillRect(x + 14, y + 2, 12, 6);
    ctx.fillRect(x + 4, y + 22, 12, 6);
  } else if (tile === T.GRASS) {
    ctx.fillStyle = '#1f5c2a';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#2e8a3a';
    for (let i = 0; i < 6; i++) {
      const gx = x + (i * 5) % TILE, gy = y + (i * 7) % TILE;
      ctx.fillRect(gx, gy, 4, 3);
    }
  } else if (tile === T.EAGLE) {
    drawEagle(x, y, false);
  }
}

function drawEagle(x, y, dead) {
  ctx.fillStyle = '#2a2a32';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = dead ? '#555' : '#ffd24a';
  ctx.beginPath();
  const cx = x + TILE / 2, cy = y + TILE / 2 + 1, R = 11;
  for (let i = 0; i < 10; i++) {
    const rad = (i % 2 === 0 ? 1 : 0.45) * R;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawTank(t) {
  const s = t.size;
  const cx = t.x + s / 2, cy = t.y + s / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t.dir * Math.PI / 2);

  // 履带
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(-s/2, -s/2, 6, s);
  ctx.fillRect(s/2 - 6, -s/2, 6, s);
  ctx.fillStyle = '#4a4a4a';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(-s/2 + 1, -s/2 + 2 + i * 5, 4, 3);
    ctx.fillRect(s/2 - 5, -s/2 + 2 + i * 5, 4, 3);
  }
  // 车体
  ctx.fillStyle = t.color;
  ctx.fillRect(-s/2 + 5, -s/2 + 4, s - 10, s - 8);
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(-s/2 + 6, -s/2 + 4, s - 12, 4);
  // 炮塔
  ctx.fillStyle = t.isPlayer ? '#e8a800' : shade(t.color);
  ctx.fillRect(-5, -5, 10, 10);
  // 炮管
  ctx.fillStyle = '#222';
  ctx.fillRect(-2, -s/2 - 6, 4, s/2 + 1);

  ctx.restore();

  // 出生保护闪烁
  if (t.spawnTimer > 0 && Math.floor(frame / 4) % 2 === 0) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    ctx.fillRect(t.x, t.y, s, s);
    ctx.restore();
  }
}

function shade(hex) {
  // 简单变暗
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n >> 16) - 40), g = Math.max(0, ((n >> 8) & 255) - 40), b = Math.max(0, (n & 255) - 40);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function drawEffects() {
  for (const f of effects) {
    const p = 1 - f.life / f.maxLife;
    ctx.save();
    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(f.x, f.y, (3 + p * 14) * f.scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(f.x, f.y, (1 + p * 5) * f.scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      drawTile(c, r);

  for (const b of bullets) {
    ctx.fillStyle = b.owner === 'player' ? '#fff' : '#ffd0d0';
    ctx.fillRect(b.x, b.y, b.size, b.size);
  }
  if (player && !player.dead) drawTank(player);
  for (const e of enemies) if (!e.dead) drawTank(e);

  // 草地覆盖层（坦克压过的草地要盖住车体下半部，简化：草地整体盖一层半透明）
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] === T.GRASS) {
        ctx.fillStyle = 'rgba(46,138,58,.55)';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        ctx.fillStyle = '#2e8a3a';
        for (let i = 0; i < 6; i++) {
          ctx.fillRect(c * TILE + (i * 5) % TILE, r * TILE + (i * 7) % TILE, 4, 3);
        }
      }
    }
  }
  drawEffects();
}

/* ============ HUD ============ */
function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  let html = '';
  for (let i = 0; i < Math.max(0, lives); i++) html += '<span class="icon life-icon"></span>';
  livesEl.innerHTML = html || '<span style="color:#8b98a9">0</span>';
  const remaining = enemyQueue.length + enemies.length;
  let ehtml = '';
  for (let i = 0; i < remaining; i++) ehtml += '<span class="icon enemy-icon"></span>';
  enemiesEl.innerHTML = ehtml || '<span style="color:#8b98a9">0</span>';
}

/* ============ 主循环 ============ */
function loop() {
  if (gameState === 'playing') { frame++; update(); }
  else if (gameState === 'paused') { /* 冻结 */ }
  else { frame++; } // 菜单等仍需推进动画帧
  draw();
  requestAnimationFrame(loop);
}

resetGrid(1);
updateHUD();
setState('menu');
requestAnimationFrame(loop);
})();
</script>
